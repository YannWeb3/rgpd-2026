<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit RGPD — Cartographie des traitements</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>🛡️ Kit RGPD — UNAPEI92</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="topbar-actions">
        <a href="dashboard-v2.html" class="topbar-btn">⬅ Retour au dashboard</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h2>🗺️ Cartographie des traitements</h2>
      <p>Vue d'ensemble des traitements de données de votre établissement.</p>
    </div>

    <div class="card">
      <div class="table-wrap" id="table-container">
        <p style="text-align:center; color:var(--text-muted);" id="loading-msg">Chargement...</p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Vérification session
    const session = JSON.parse(sessionStorage.getItem('rgpd_session') || '{}');
    if (!session.success) location.href = 'login.html';

    const CODE = session.code;
    document.getElementById('subtitle').textContent = `Référent : ${session.referent || ''} · Code : ${CODE}`;

    function loadCartographie() {
      const traitements = MOCK_DATA.registre.filter(r => r.code_etab === CODE);
      const container = document.getElementById('table-container');

      if (!traitements.length) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Aucun traitement pour cet établissement.</p>';
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Traitement</th>
              <th>Catégorie</th>
              <th>Responsable</th>
              <th>Base légale</th>
              <th>Durée</th>
              <th>Destinataires</th>
            </tr>
          </thead>
          <tbody>
            ${traitements.map(t => `
              <tr>
                <td><strong>${t.traitement}</strong></td>
                <td>${t.categorie}</td>
                <td>${t.responsable || '—'}</td>
                <td>${t.base_legale || '—'}</td>
                <td>${t.duree_conservation || '—'}</td>
                <td>${t.destinataires || '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <p style="margin-top:12px; font-size:0.85rem; color:var(--text-muted);">
          ${traitements.length} traitement(s) référencé(s)
        </p>
      `;
    }

    loadCartographie();
  </script>
</body>
</html>
